<!doctype html>
<html lang="pt-BR" data-page="clips">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050607">
    <meta name="description" content="Clipes publicados pela comunidade Peace, com busca, curtidas e comentários.">
    <title>Clipes — Peace</title>
    <link rel="icon" href="/assets/peace-bird.png" type="image/png">
    <link rel="stylesheet" href="/styles.css?v=20261116-06">
    <script defer src="/script.js?v=20261116-06"></script>
  </head>
  <body data-page="clips">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div class="site-shell flow-page public-context-page">
      <main id="conteudo" class="flow-main flow-main--public clips-main" tabindex="-1">
        <section class="clips-feed" aria-label="Feed de clipes">
          <form class="clips-search" data-clips-search role="search">
            <label class="sr-only" for="clips-query">Buscar clipes</label>
            <div class="clips-search-row">
              <span class="clips-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></span>
              <input id="clips-query" data-clips-query name="q" type="search" maxlength="80" autocomplete="off" placeholder="Buscar por vídeo ou autor">
              <button class="clips-search-submit" data-clips-submit type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></button>
            </div>
                    <div class="clips-filter-row" role="group" aria-label="Filtrar clipes"><button type="button" class="clips-filter is-active" data-clips-filter="all" aria-pressed="true">Tudo</button><button type="button" class="clips-filter" data-clips-filter="engagement" aria-pressed="false">Mais reagidos</button><button type="button" class="clips-filter" data-clips-filter="least_engagement" aria-pressed="false">Menos reagidos</button><button type="button" class="clips-filter" data-clips-filter="recent" aria-pressed="false">Mais recentes</button></div>
          </form>
          <div class="clips-feed-heading">
            <p data-clips-status role="status" aria-live="polite">Preparando a busca…</p>
          </div>

          <div class="clips-grid" data-clips-list role="list" aria-busy="true" aria-label="Clipes publicados"></div>
          <p class="clips-empty" data-clips-empty hidden role="status"></p>
          <button class="clips-retry text-button" data-clips-retry type="button" hidden>Repetir busca</button>
        </section>
      </main>

      <div class="site-toast clips-toast" data-clips-toast role="status" aria-live="polite" hidden></div>
      <footer class="site-footer flow-footer"><a class="brand brand--footer" href="/" aria-label="Peace — voltar ao início"><span class="brand-mark"><img src="/assets/peace-bird.png" alt="" width="1254" height="1254"></span><span class="brand-lockup"><strong>PEACE</strong><small>PEACE</small></span></a><p>Clipes públicos, conversa responsável.</p><a class="footer-link" href="/estudos/">Estudos <span aria-hidden="true">↗</span></a></footer>
    </div>
  </body>
</html>
