<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050607">
    <title>Preparando convite — Peace</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #050607; color: #eef3f5; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.5rem; background: radial-gradient(circle at 50% 20%, rgba(124, 157, 170, .16), transparent 42%), #050607; }
      main { width: min(100%, 30rem); padding: 2rem; border: 1px solid rgba(194, 211, 218, .22); border-radius: 1.25rem; background: rgba(18, 25, 30, .78); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .28); text-align: center; }
      img { width: 3.5rem; height: 3.5rem; object-fit: contain; margin-bottom: 1.4rem; filter: brightness(0) invert(1); }
      h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.25rem); letter-spacing: -.05em; }
      p { margin: .8rem 0 0; color: #aebdc4; line-height: 1.6; }
      .loader { width: 2rem; height: 2rem; margin: 1.5rem auto 0; border: 2px solid rgba(194, 211, 218, .22); border-top-color: #c2d3da; border-radius: 50%; animation: spin 900ms linear infinite; }
      [hidden] { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/peace-bird.png" alt="Peace">
      <h1 data-title>Preparando seu convite.</h1>
      <p data-message>A nova guia está pronta. Assim que o Peace Tools confirmar o link, você será levado ao Discord.</p>
      <span class="loader" data-loader aria-hidden="true"></span>
    </main>
    <script>
      (function () {
        var error = new URLSearchParams(window.location.search).get("state") === "error";
        if (!error) return;
        document.querySelector("[data-title]").textContent = "Não foi possível gerar o convite.";
        document.querySelector("[data-message]").textContent = "Volte para a guia da Peace e tente novamente em alguns instantes.";
        document.querySelector("[data-loader]").hidden = true;
      }());
    </script>
  </body>
</html>
