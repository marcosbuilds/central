[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peace-discord-bot"
version = "0.1.0"
description = "Bot modular da Real Peace, com migração e fluxo de set."
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "discord.py>=2.4,<3",
    "PyNaCl>=1.5,<2",
    "davey>=0.1,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
peace-bot = "bot.main:run"
peace-snapshot = "bot.commands.snapshot:run"
peace-nick = "bot.commands.nick:run"

[tool.setuptools.packages.find]
include = ["bot*"]

